{% extends "main.html" %}

<!-- Additional styles for landing page -->
<style>
/* Set background colour for page - use variable, don't hard code */
.md-container {
    background-color: var(--md-primary-fg-color);
}

    /* Banner/hero image */
    .home-image {
        max-height: 25vh;
        /*curve bottom corners */
        border-radius: 0 0 30px 30px;
    }

    /* page content container*/
    .home-container {
        /*fill .md-container height*/
        flex: 1;
        /*centers on screen at readable width*/
        margin-left: auto;
        margin-right: auto;
        max-width: 61rem;
        padding: 0 0.2rem 1rem;
        /*place hero & cards sections inside container*/
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

        /*Titles & logo container */
        .home-hero {
            display: flex;
            flex-direction: row-reverse;
            flex-wrap: wrap;
            /* padding: 2em 0; */
            color: var(--md-primary-bg-color);
        }

            /*Logo*/
            .home-hero img.logo {
                max-height: 138px;
            }

            /* Titles sub-container */
            .home-hero__content {
                padding: 3em 1em;
                flex: 1;
                min-width: 450px;
                max-width: 100%;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: flex-start;
            }

                /*Main title*/
                .home-hero h1 {
                    margin-bottom: 0rem;
                    color: currentColor; /*overrides main h1 accent colour*/
                    font-size: 3em;
                    font-weight: 700;
                }

                /*Subtitle/text*/
                .home-hero p {
                    font-size: 1.5em;
                }

        /*Cards/content container*/
        .md-content.home-cards {
            display: block;
            flex: 0;
            border-radius: 30px;
            background: var(--md-default-bg-color);
        }

        .home-cards h2 {
            margin: 0;
        }
    
    /*hide auto-generated container for default md page content*/    
    .md-main .md-content {
        display: none;
    }
