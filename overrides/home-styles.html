{% extends "main.html" %}
{% block tabs %}
{{ super() }}

<!-- Additional styles for landing page -->
<style>
/* Set background colour for page - use variable, don't hard code */
.md-container {
    background-image: url("assets/images/welcome.jpg");
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center center;
}
    /*Titles & logo container */
    .home-hero {
        /*fill .md-container height*/
        flex: 1;
        /*arrange image & titles*/
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: center;
    }
        /* Titles & logo*/
        .home-hero__content {
            flex: 1;
            max-width: 60rem;
            margin: 1.5rem;
            border-radius: 2rem;
            padding: 1.5rem;
            background: var(--md-code-bg-color);
            opacity: 90%;
            display: flex;
            flex-direction: column;
        }

            /*Inner container to retrict width*/
            .home-hero__content-inner {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: flex-start;
            }

            /*Logo*/
            .home-hero .logo {
                max-height: 100px;
                fill: currentColor;
                /* color: var(--md-default-fg-color); */
            }

            /*Main title*/
            .home-hero h1 {
                margin-bottom: 0rem;
                color: currentColor; /*overrides main h1 accent colour */
                font-size: 2.25rem;
                font-weight: 700;
            }

            /*Subtitle/text*/
            .home-hero p {
                font-size: 1.2rem;
                margin: 0;
            } 

            /*bottom border on text */
            .home-hero p.bottom-border {
                padding: 0 0 0.5rem;
                margin: 0 0 0.5rem;
                border-bottom: 0.05rem solid var(--md-default-fg-color--lighter);
            }
            

    /*Cards/content container*/
    .home-hero .home-cards .grid.cards>ul>li {
        /* border: .1rem solid var(--md-default-fg-color--light); */
        border: 0;
        border-radius: .5rem;
        display: block;
        margin: 0.5rem;
        padding: .8rem;
        /* transition: border .25s, box-shadow .25s; */
        transition: none;
        background: var(--md-default-bg-color);
        list-style-type: none;
    }

    .home-hero .home-cards .grid.cards>ul>li:hover,
    .home-hero .home-cards .grid.cards>ul>li:focus {
        border: 0;
        box-shadow: none;
    }

    /*links */
    .home-hero.md-typeset a {
        color: var(--md-default-fg-color);
    }

    .home-hero.md-typeset a:hover,
    .home-hero.md-typeset a:focus {
        background-color: var(--md-default-fg-color);
        color: var(--md-primary-bg-color);
    }

    /*hide auto-generated container for default md page content*/    
    .md-main .md-content {
        display: none;
    }

    .md-main {
        flex: 0;
    }

    .md-main__inner {
        margin-top: 0
    }

</style>
{% endblock %}
