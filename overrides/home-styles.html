            .home-hero img.logo {

            .home-hero h1 {
                margin-bottom: 0rem;

                font-weight: 700;
            }

            /*Subtitle/text*/
            .home-hero p {
                font-size: 1.2rem;
                margin: 0;
            }

        /* Banner/hero image */
        .home-hero img.home-image {
            width: 50%;
            min-width: 450px;
            object-fit: cover;
        }    

    /*Cards/content container*/
    .home-hero .home-cards .grid.cards>ul>li {
        border: .1rem solid var(--md-default-fg-color--light);
        border-radius: .5rem;
        display: block;
        margin: 0.5rem;
        padding: .8rem;
        transition: border .25s, box-shadow .25s;
        list-style-type: none;
    }

    /*links */
    .home-hero.md-typeset a {
        color: var(--md-default-fg-color);
    }

    .home-hero.md-typeset a:hover,
    .home-hero.md-typeset a:focus {
        background-color: var(--md-default-fg-color);
        color: var(--md-primary-bg-color);
    }
