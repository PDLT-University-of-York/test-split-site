# Site-wide settings

site_name: Guides for Online Learning Tools at University of York, UK
site_author: University of York
# info on left of footer
copyright: <a href="https://vle-support.york.ac.uk/student">← To Student Hub</a> | Copyright &copy; 2026 University of York, UK | <a href="https://www.york.ac.uk/about/legal-statements/#tab-1">Legal statements</a>

theme:
  name: material # DO NOT CHANGE
  custom_dir: overrides # Where custom HTML pages, icons etc. live
  font:
    text: Inter
  icon:
    logo: octicons/home-16
    tag: # Shown in tag label at the top of pages
      KeyGuideTeaching: material/key-variant
      KeyGuideAdmin: material/key-variant
      Accessibility: octicons/accessibility-inset-16
      Assessment: octicons/check-circle-16
      Communication: octicons/megaphone-16
      InteractiveContent: material/cursor-default-click-outline
      Training: material/school
      Help: material/help-circle-outline
      Ultra: material/laptop
      Panopto: fontawesome/solid/video
      OtherTools: material/toolbox
      CaseStudy: material/account-voice
  palette: # Colour schemes
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom #UoY branding - dark blue
      accent: custom #UoY branding - purple
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey #UoY branding-ish
      accent: yellow #UoY branding-ish
      toggle: 
        icon: material/brightness-7
        name: Switch to light mode
  features:
    - navigation.tabs # pulls top level sections into top nav bar
    - navigation.tabs.sticky # top nav bar always visible (doesn't disappear on scroll)
    # - navigation.sections # on = pages all shown, off = toggle to show/hide section pages
    - navigation.indexes # attach a page to a section header directly (instead of appearing within  it) 
    - navigation.path # in dev: adds breadcrumbs above page title
    - navigation.footer # adds previous/next page links in footer
    - navigation.top # adds Return to Top button
    - navigation.tracking # adds current heading into page URL
    - search.suggest # Suggest pages before 'hard' search
    - content.tabs.link # linked content tabs

markdown_extensions: # allow various extra jazzy stuff 
  - meta
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true # set up content tabs
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - attr_list
  - md_in_html
  - tables
  - toc: # Within page Table of Contents (right hand nav bar)
      permalink: false # adds an anchor link at end of each header (shown on hover)
      title: In this guide # ToC title. Can't contain :
      toc_depth: 3 # Heading level to go down to. heading 2 = main sections

extra:
  generator: false
  social: # links on the right side of the footer
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/channel/UCNRdi4ySV6gnXOojwv-xa5g
      name: DET on YouTube
    - icon: simple/linktree
      link: https://linktr.ee/uoyvle
      name: DET's linktree
    - icon: fontawesome/solid/paper-plane
      link: mailto:vle-support@york.ac.uk
      name: Contact Support Desk
  tags: # To link tag text to the icons in 'theme' section
    Key guide - teaching: KeyGuideTeaching
    Key guide - admin: KeyGuideAdmin
    Accessibility: Accessibility
    Assessment: Assessment
    Communication: Communication
    Interactive content: InteractiveContent
    Training: Training
    Help: Help
    Ultra: Ultra
    Panopto: Panopto
    Other tools: OtherTools
    Case study: CaseStudy
  analytics:
    provider: google
    property: G-Q6B3RZT1K0

extra_css:
  - css/extra.css # our custom CSS styles (in overrides)

extra_javascript:
  - javascripts/extra.js # our custom Javascript (in overrides)

plugins:
  - blog:
      blog_dir: blog # name of blog folder
      post_date_format: "medium"
      pagination_per_page: 10
      post_url_date_format: yyyy/MMM/dd
      blog_toc: false
      # post authors
      authors: false
      # authors_file: "blog/.authors.yml"
      # post categories
      categories_allowed:
        - Monthly newsletter
        - System updates
        - Preparation
        - Training
        - News and publications
        - Students
  - redirects: # https://github.com/mkdocs/mkdocs-redirects 
      redirect_maps:
      # 'folder/old-page.md': 'folder/new-page.md'
        'ultra/access-sites.md': 'ultra/courses-list.md'
        'ultra/course-links.md': 'ultra/links.md#course-link'
        'ultra/course-roles.md' : 'ultra/user-management.md#user-roles'
        'ultra/embed-content.md': 'ultra/documents.md#block-html'
        'ultra/enrol-cohort.md' : 'ultra/user-management.md#enrol-a-cohort-or-user-group'
        'ultra/enrol-user.md' : 'ultra/user-management.md#enrol-individual-users'
        'ultra/external-users.md' : 'ultra/user-management.md#external-user-access'
        'ultra/images.md': 'ultra/documents.md#block-image'
        'ultra/navigate-ultra-site.md' : 'ultra/getting-started.md#ultra-site-structure--module-template'
        'ultra/prepare-module-site.md': 'ultra/prepare-site.md' # keep long term
        'ultra/release-conditions.md': 'ultra/content-visibility.md'
        'ultra/site-availability.md' : 'ultra/course-access.md'
        'ultra/text.md': 'ultra/documents.md'    
        'ultra/ultra-template.md': 'ultra/prepare-site.md'  # keep long term
        'ultra/getting-started.md': 'ultra/navigation.md'
        'ultra/unenrol-user.md' : 'ultra/user-management.md#unenrol-a-user'
        'ultra/workshop-ultra-essentials-teaching.md': 'training/index.md'
        'ultra/youtube.md': 'ultra/documents.md#videos'
        'panopto/logging-into-panopto.md': 'panopto/log-in.md'
        'panopto/panopto-basic-editing.md': 'panopto/basic-editing.md'
        'panopto/reusing-module-media.md': 'panopto/reuse-module-media.md'
        'panopto/editing-captions.md': 'panopto/captions.md'
        'contact-us/index.md': 'help/contact-us.md'
        'updates/index.md': 'help/updates-issues.md'
        'updates/suggestions.md': 'help/contact-us.md'
        'contact-us/usernames.md': 'help/usernames.md'
        'contact-us/ycodes.md': 'help/ycodes.md'
        'contact-us/screenshots.md': 'help/screenshots.md'
        'tags-index.md': 'help/site-index.md'
        'assessment/group-assignment.md' : 'ultra/assignment-groups.md'
        'training/workshops-resources/index.md': 'training/index.md'
  - search
  # Unused file checker - https://github.com/wilhelmer/mkdocs-unused-files (use only in command line, do not commit, IT WILL BREAK THINGS)
  # - unused_files
