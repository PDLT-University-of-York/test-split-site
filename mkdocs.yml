theme:
  name: material
  custom_dir: overrides
  font:
    text: Inter
  icon:
    logo: material/home-circle
    tag:
      Ultra: material/laptop
      Panopto: fontawesome/solid/video
      ReadingList: octicons/book-16
      Canvas: material/laptop
      Xerte: material/monitor-edit
      Padlet: fontawesome/brands/padlet
      Mentimeter: material/chart-bar
      Foundation: simple/go
      Advanced: material/stairs-up
      Teaching: octicons/mortar-board-16
      Administration: fontawesome/regular/clipboard
      Workshop: fontawesome/solid/school
      Updates: material/new-box
      Issues: material/alert
      Outages: material/fire-alert
      TurnItIn: fontawesome/regular/clipboard
  # favicon: img/favicon.jpg
  # palette:
  #   - media: "(prefers-color-scheme: light)" 
  #     scheme: default
  #     toggle:
  #       icon: material/toggle-switch-off-outline
  #       name: Switch to dark mode
  #   - media: "(prefers-color-scheme: dark)" 
  #     scheme: slate
  #     toggle:
  #       icon: material/toggle-switch
  #       name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    # - navigation.expand
    # - navigation.sections
    - navigation.top
    # - toc.integrate

markdown_extensions:
  - meta
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: false
      title: On this page

