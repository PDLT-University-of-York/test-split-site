theme:
  name: material
  custom_dir: overrides
  font:
    text: Inter
  icon:
    logo: octicons/home-16
    tag:
      KeyGuideTeaching: simple/go
      KeyGuideAdmin: simple/go
      Accessibility: octicons/accessibility-inset-16
      Assessment: octicons/check-circle-16
      Communication: octicons/megaphone-16
      InteractiveContent: material/cursor-default-click-outline
      Training: material/school
      Help: material/help-circle-outline
      Ultra: material/laptop
      Panopto: fontawesome/solid/video
      OtherTools: material/toolbox
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom #UoY branding - dark blue
      accent: custom #UoY branding - light blue
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey #UoY branding-ish
      accent: yellow #UoY branding-ish
      toggle: 
        icon: material/brightness-7
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.path
    - navigation.footer
    # - navigation.expand
    # - navigation.sections
    - navigation.top
    - navigation.tracking
    # - toc.integrate
    - search.suggest

markdown_extensions:
  - meta
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: false
      title: On this page

