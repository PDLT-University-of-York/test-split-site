    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.path
    # - navigation.expand
    # - navigation.sections
    - navigation.top
    # - toc.integrate

markdown_extensions:
  - meta
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: false
      title: On this page

